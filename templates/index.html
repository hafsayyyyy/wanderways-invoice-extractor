<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderWays Invoice Extractor</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #12355b; }
        header { background: #12355b; color: white; padding: 24px 16px; text-align: center; }
        main { max-width: 850px; margin: 40px auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 4px 16px #00000012; }
        input[type="file"] { display: block; width: 100%; margin: 20px 0; padding: 14px; border: 1px dashed #4da3ff; border-radius: 8px; }
        button { background: #12355b; color: white; border: none; border-radius: 8px; padding: 13px 22px; cursor: pointer; font-size: 16px; }
        button:disabled { opacity: 0.6; cursor: wait; }
        #status { margin: 20px 0; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #d9e2ec; padding: 12px; text-align: left; vertical-align: top; }
        th { background: #f4f7fb; width: 32%; }
        .errors { margin-top: 24px; padding: 16px; border-radius: 8px; background: #fff4f4; }
        .errors li { margin: 6px 0; }
        .hint { color: #555; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>WanderWays</h1>
        <p>Travel Invoice Extractor</p>
    </header>

    <main>
        <h2>Upload Your Invoice</h2>
        <p>Select a travel invoice in PDF format.</p>

        <form id="upload-form">
            <label for="invoice-file">Choose PDF invoice</label>
            <input id="invoice-file" name="file" type="file" accept=".pdf,application/pdf" required>
            <p class="hint">PDF files only.</p>
            <button type="submit" id="submit-button">Extract Invoice</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="results" class="hidden">
            <h2>Extracted Fields</h2>
            <table>
                <tbody id="results-body"></tbody>
            </table>

            <div id="errors-box" class="errors hidden">
                <h3>Validation Errors</h3>
                <ul id="errors-list"></ul>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("upload-form");
        const fileInput = document.getElementById("invoice-file");
        const statusBox = document.getElementById("status");
        const results = document.getElementById("results");
        const resultsBody = document.getElementById("results-body");
        const errorsBox = document.getElementById("errors-box");
        const errorsList = document.getElementById("errors-list");
        const submitButton = document.getElementById("submit-button");

        function displayResults(data) {
            resultsBody.innerHTML = "";
            const fields = data.data || {};

            Object.entries(fields).forEach(([key, value]) => {
                const row = document.createElement("tr");
                const keyCell = document.createElement("th");
                const valueCell = document.createElement("td");

                keyCell.textContent = key;
                valueCell.textContent = Array.isArray(value)
                    ? value.join(", ")
                    : value ?? "";

                row.appendChild(keyCell);
                row.appendChild(valueCell);
                resultsBody.appendChild(row);
            });

            errorsList.innerHTML = "";
            const errors = data.validation_errors || [];

            if (errors.length) {
                errors.forEach((error) => {
                    const item = document.createElement("li");
                    item.textContent = error;
                    errorsList.appendChild(item);
                });
                errorsBox.classList.remove("hidden");
            } else {
                errorsBox.classList.add("hidden");
            }

            results.classList.remove("hidden");
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const file = fileInput.files[0];

            if (!file || !file.name.toLowerCase().endsWith(".pdf")) {
                statusBox.textContent = "Please select a PDF file.";
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            submitButton.disabled = true;
            statusBox.textContent = "Processing invoice...";
            results.classList.add("hidden");

            try {
                const response = await fetch("/extract", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                displayResults(data);

                if (!response.ok || data.success === false) {
                    statusBox.textContent = data.error || "Invoice processing failed.";
                } else if (data.valid) {
                    statusBox.textContent = "Invoice processed and validation passed.";
                } else {
                    statusBox.textContent = "Processing completed, but validation found errors.";
                }
            } catch (error) {
                statusBox.textContent = "Could not connect to the Flask server.";
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
